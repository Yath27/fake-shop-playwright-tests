name: Playwright UI Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - vercel-preview-deployed
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Optional deployment URL to test (leave blank to discover the latest Ready deployment)
        required: false
        type: string

permissions:
  contents: read

jobs:
  ui-tests:
    name: Run Playwright UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Playwright tests
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install Playwright project dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Resolve test URL
        id: test-url
        shell: bash
        env:
          DISPATCH_URL: ${{ github.event.client_payload.deployment_url }}
          MANUAL_URL: ${{ inputs.deployment_url }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          test_url=""

          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            test_url="$DISPATCH_URL"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$MANUAL_URL" ]]; then
            test_url="$MANUAL_URL"
          else
            if [[ -z "$VERCEL_API_TOKEN" || -z "$VERCEL_PROJECT_ID" ]]; then
              echo "Set VERCEL_API_TOKEN and VERCEL_PROJECT_ID to discover the latest Ready deployment." >&2
              exit 1
            fi

            api_args=(
              --data-urlencode "projectId=$VERCEL_PROJECT_ID"
              --data-urlencode "state=READY"
              --data-urlencode "limit=100"
            )
            if [[ -n "$VERCEL_TEAM_ID" ]]; then
              api_args+=(--data-urlencode "teamId=$VERCEL_TEAM_ID")
            fi

            deployments=$(curl --fail --silent --show-error --get \
              --header "Authorization: Bearer $VERCEL_API_TOKEN" \
              "https://api.vercel.com/v7/deployments" \
              "${api_args[@]}")

            test_url=$(jq -r '([.deployments[] | select(.state == "READY" and .url != null)] | max_by(.createdAt | tonumber) | .url) // empty' <<< "$deployments")
          fi

          if [[ -z "$test_url" ]]; then
            echo "No Ready Vercel deployment URL was found." >&2
            exit 1
          fi

          if [[ ! "$test_url" =~ ^https:// ]]; then
            test_url="https://$test_url"
          fi

          echo "base_url=$test_url" >> "$GITHUB_OUTPUT"
          echo "Testing against: $test_url"

      - name: Run Playwright tests against Vercel deployment
        env:
          BASE_URL: ${{ steps.test-url.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm test

