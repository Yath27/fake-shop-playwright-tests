name: Playwright UI Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - vercel-preview-deployed

permissions:
  contents: read

jobs:
  ui-tests:
    name: Run Playwright UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Playwright tests
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install Playwright project dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests against Vercel Preview
        env:
          BASE_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.deployment_url || vars.FAKE_SHOP_PREVIEW_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm test

